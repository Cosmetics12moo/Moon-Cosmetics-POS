name: moon_cosmetics_pos
description: Clean-room reconstructed cosmetics retail POS based on the supplied IDEATECH RETAIL Windows build.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # PostgreSQL client compatible with Dart 3.4.x.
  postgres: ^3.4.8

  uuid: ^4.5.1
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/moon_logo.png
