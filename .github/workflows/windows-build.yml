name: Moon Cosmetics POS - Windows Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Verify Flutter / Dart
      # --------------------------------------------------
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Version
        run: flutter --version

      # --------------------------------------------------
      # 4. Enable Windows desktop
      # --------------------------------------------------
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # --------------------------------------------------
      # 5. Check if Windows platform exists (but don't create)
      # --------------------------------------------------
      - name: Check Windows Platform
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            Write-Host "Windows platform files not found."
            Write-Host "Generating Windows platform files..."
            flutter create `
              --platforms=windows `
              --project-name moon_cosmetics_pos `
              .
            Write-Host "Windows platform files generated successfully."
          } else {
            Write-Host "Windows platform files found."
          }

      # --------------------------------------------------
      # 6. 🔥 FORCE RE-GENERATE Windows files with Visual Studio 2022
      # (Deletes old windows/ folder and creates fresh one)
      # --------------------------------------------------
      - name: Re-generate Windows Platform for VS 2022
        shell: pwsh
        run: |
          Write-Host "Removing old windows folder..."
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          Write-Host "Creating fresh Windows platform files with VS 2022..."
          flutter create `
            --platforms=windows `
            --project-name moon_cosmetics_pos `
            .
          Write-Host "Windows platform regenerated successfully."

      # --------------------------------------------------
      # 7. Get dependencies
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------
      # 8. Analyze Dart code
      # --------------------------------------------------
      - name: Flutter Analyze
        run: flutter analyze

      # --------------------------------------------------
      # 9. Run tests
      # --------------------------------------------------
      - name: Flutter Test
        run: flutter test

      # --------------------------------------------------
      # 10. Build Windows Release
      # --------------------------------------------------
      - name: Build Windows Release
        run: flutter build windows --release

      # --------------------------------------------------
      # 11. Verify build output
      # --------------------------------------------------
      - name: Verify Windows Build
        shell: pwsh
        run: |
          $releasePath = "build\windows\x64\runner\Release"
          if (!(Test-Path $releasePath)) {
            Write-Error "Windows Release directory was not created."
            exit 1
          }
          $exe = Get-ChildItem $releasePath -Filter "*.exe" -Recurse
          if ($exe.Count -eq 0) {
            Write-Error "No Windows EXE was found."
            exit 1
          }
          Write-Host "Windows EXE found:"
          $exe | ForEach-Object { Write-Host $_.FullName }

      # --------------------------------------------------
      # 12. Create distributable ZIP
      # --------------------------------------------------
      - name: Package Windows Application
        shell: pwsh
        run: |
          $releasePath = "build\windows\x64\runner\Release"
          $zipPath = "Moon_Cosmetics_POS_Windows_Release.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive `
            -Path "$releasePath\*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal
          Write-Host "Created: $zipPath"

      # --------------------------------------------------
      # 13. Upload Windows build as GitHub Artifact
      # --------------------------------------------------
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon_Cosmetics_POS_Windows
          path: Moon_Cosmetics_POS_Windows_Release.zip
          if-no-files-found: error
          retention-days: 30
